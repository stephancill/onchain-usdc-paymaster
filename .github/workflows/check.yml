name: Check
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run contracts:check
