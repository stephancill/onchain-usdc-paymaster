[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "out"
libs = ["lib"]
solc = "0.8.36"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true

[profile.default.fuzz]
runs = 256

[profile.ci.fuzz]
runs = 2048

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
vibenet = "${VIBENET_RPC_URL}"
